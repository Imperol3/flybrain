<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fly Brain Lab — Cinematic Viewer</title><style>
:root{--bg:#03050a;--panel:rgba(5,9,17,.86);--line:#24314a;--text:#edf5ff;--muted:#77849b;--cyan:#32d8f5;--pink:#ff376f;--amber:#f5a623;--green:#46efb0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace}#stage{position:fixed;inset:0}canvas{display:block}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 43%,transparent 35%,rgba(0,0,0,.58) 120%),repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px);mix-blend-mode:screen}.glass{background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.42);backdrop-filter:blur(16px)}header{position:fixed;left:28px;top:24px;z-index:4;pointer-events:none}h1{font-size:18px;letter-spacing:.06em;margin:0 0 6px}.tag{font-size:10px;color:var(--muted)}#live{display:inline-block;margin-left:8px;padding:2px 7px;border:1px solid var(--pink);border-radius:99px;color:var(--pink);font-size:8px;vertical-align:2px}#live.ok{border-color:var(--green);color:var(--green)}#topright{position:fixed;right:24px;top:22px;z-index:5;display:flex;align-items:center;gap:8px}button,select,input{font:inherit}button{border:1px solid var(--line);background:rgba(6,11,20,.88);color:var(--text);border-radius:7px;padding:8px 11px;cursor:pointer}button:hover{border-color:var(--cyan)}button:disabled{opacity:.4}.primary{background:var(--cyan);border-color:var(--cyan);color:#041018;font-weight:800}#shot{font-size:9px;color:var(--cyan);padding:8px 10px}#controls{position:fixed;right:24px;top:68px;width:270px;padding:14px;z-index:4;transform:translateX(320px);opacity:0;transition:.25s ease;border-radius:10px}.controls-open #controls{transform:none;opacity:1}label{display:block;font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}select,input[type=number]{width:100%;margin-top:5px;padding:8px;background:#0c1320;color:var(--text);border:1px solid var(--line);border-radius:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:7px;align-items:center;text-transform:none;letter-spacing:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}#hud{position:fixed;left:28px;bottom:27px;width:340px;z-index:4;border-radius:4px;overflow:hidden}.hudhead{display:flex;justify-content:space-between;background:#080d19;padding:9px 12px;border-bottom:1px solid var(--line);font-size:9px;color:var(--muted)}.hudmain{display:grid;grid-template-columns:94px 1fr;gap:12px;padding:11px 12px}.big{font-size:28px;line-height:.95}.big small{display:block;font-size:8px;color:var(--muted);margin-top:7px}.channel{display:grid;grid-template-columns:48px 1fr 38px;align-items:center;gap:7px;margin:4px 0;font-size:8px;color:var(--muted)}.track{height:4px;background:#152034}.track i{display:block;height:100%;width:0;transition:width .15s;background:var(--cyan)}#lplc2Bar{background:var(--amber)}#dnpBar{background:var(--pink)}#steerBar{background:#9b7cff}.value{text-align:right;color:var(--text)}#statusline{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:4;display:flex;gap:20px;align-items:center;padding:9px 14px;border-radius:6px;font-size:9px;color:var(--muted)}#status{color:var(--text)}#status.success{color:var(--green)}.cinematic header,.cinematic #topright,.cinematic #controls,.cinematic #hud,.cinematic #statusline{opacity:0;pointer-events:none;transition:.35s}#dataset{color:var(--muted)}@media(max-width:760px){#hud{left:12px;bottom:12px;width:300px}header{left:14px;top:14px}#statusline{display:none}}
</style></head><body class="controls-open"><div id="stage"></div><header><h1>FLY BRAIN LAB <span id="live">CONNECTING</span></h1><div class="tag"><span id="dataset">dataset</span> // <span id="neuronCount">—</span> NEURONS // EMBODIED CLOSED LOOP</div></header><div id="topright"><span id="shot" class="glass">ESTABLISHING</span><button id="cinematic">CINEMATIC</button><button id="toggleControls">EXPERIMENT</button></div>
<section id="controls" class="glass"><label>Scene<select id="scenario"><option value="lab">Laboratory desk</option><option value="arena">Escape arena</option></select></label><label>Threat bearing<select id="azimuth"><option value="-45">left · −45°</option><option value="0">centred · 0°</option><option value="45" selected>right · +45°</option></select></label><div class="two"><label>Speed<input id="velocity" type="number" value="40" min="5" max="200"> cm/s</label><label>Radius<input id="radius" type="number" value="1" min=".1" max="5" step=".1"> cm</label></div><div class="two"><label class="check"><input id="silenceLC4" type="checkbox">silence LC4</label><label class="check"><input id="silenceLPLC2" type="checkbox">silence LPLC2</label></div><label class="check"><input id="brainToggle" type="checkbox" checked>connectome inside head</label><label class="check"><input id="autoCamera" type="checkbox" checked>neural-event camera direction</label><div class="actions"><button id="stop" disabled>STOP</button><button id="start" class="primary">START LOOP</button></div></section>
<section id="hud" class="glass"><div class="hudhead"><span>NEURAL REPLAY</span><span id="behaviour">IDLE</span></div><div class="hudmain"><div class="big"><span id="spikes">0</span><small>RECORDED SPIKES<br><span id="elapsed">0.00s</span></small></div><div><div class="channel"><span>LC4</span><span class="track"><i id="lc4Bar"></i></span><span id="lc4Value" class="value">0</span></div><div class="channel"><span>LPLC2</span><span class="track"><i id="lplc2Bar"></i></span><span id="lplc2Value" class="value">0</span></div><div class="channel"><span>DNp01</span><span class="track"><i id="dnpBar"></i></span><span id="dnpValue" class="value">0</span></div><div class="channel"><span>DNa02</span><span class="track"><i id="steerBar"></i></span><span id="steerValue" class="value">0</span></div></div></div></section><section id="statusline" class="glass"><span id="status">READY</span><span>SHOT <b id="shotSmall">AUTO</b></span></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script><script src="/static/viewer-v2/fly-avatar.js"></script><script src="/static/viewer-v2/brain-overlay.js"></script><script src="/static/viewer-v3/lab-environment.js"></script><script src="/static/viewer-v3/neural-monitor.js"></script><script src="/static/viewer-v3/cinematic-director.js"></script><script src="/static/viewer-v3/soundscape.js"></script><script src="/static/viewer-v3/postfx.js"></script><script src="/static/viewer-v3/app.js"></script></body></html>
