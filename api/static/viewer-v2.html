<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fly Brain Lab — Viewer V2</title>
<style>
:root{--bg:#06090b;--panel:rgba(11,16,20,.84);--line:#26343d;--text:#edf4f6;--muted:#84939d;--cyan:#4fd1e8;--amber:#f5a623;--red:#ff4d6d;--green:#58d68d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}#stage{position:fixed;inset:0}canvas{display:block}.glass{background:var(--panel);border:1px solid var(--line);border-radius:13px;backdrop-filter:blur(15px);box-shadow:0 20px 55px rgba(0,0,0,.3)}header{position:fixed;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;pointer-events:none}h1{font-size:17px;margin:0 0 5px}.sub{font-size:11px;color:var(--muted)}#connection{display:inline-flex;margin-left:8px;padding:2px 7px;border:1px solid var(--red);border-radius:99px;color:var(--red);font:600 9px ui-monospace,monospace;vertical-align:2px}#connection.ok{border-color:var(--green);color:var(--green)}#dataset{font:10px ui-monospace,monospace;color:var(--muted);text-align:right;line-height:1.5}#dataset b{display:block;color:var(--text);font-size:11px}.panel{position:fixed;top:78px;width:250px;padding:14px;transition:.25s ease}#controls{left:22px}#telemetry{right:22px}label{display:block;margin:0 0 10px;font:9px ui-monospace,monospace;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}select,input[type=number]{width:100%;margin-top:5px;padding:8px 9px;background:#121a20;border:1px solid var(--line);border-radius:7px;color:var(--text)}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{padding:9px;border:1px solid var(--line);border-radius:8px;background:#131c22;color:var(--text);cursor:pointer}button.primary{background:var(--cyan);border-color:var(--cyan);color:#062029;font-weight:800}button:disabled{opacity:.42;cursor:not-allowed}.metric{display:grid;grid-template-columns:1fr auto;padding:8px 0;border-bottom:1px solid rgba(38,52,61,.65);font:10px ui-monospace,monospace;color:var(--muted)}.metric b{color:var(--text);font-size:12px}.metric .cyan{color:var(--cyan)}.metric .amber{color:var(--amber)}.metric .red{color:var(--red)}#statusbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:min(700px,calc(100vw - 44px));padding:11px 14px;display:grid;grid-template-columns:190px 1fr 170px;align-items:center;gap:12px;font:10px ui-monospace,monospace;color:var(--muted)}#status{color:var(--text)}#status.success{color:var(--green)}.track{height:3px;background:var(--line);border-radius:9px;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--red));transition:width .12s linear}.senses{text-align:right}#experience{position:fixed;right:22px;bottom:78px;font:10px ui-monospace,monospace;padding:8px 10px}.experience .panel,.experience #statusbar{opacity:0;pointer-events:none}.experience header .sub,.experience #dataset{opacity:0}body:not(.experience) .panel:hover{background:rgba(11,16,20,.94)}@media(max-width:760px){.panel{width:205px}.metric{font-size:9px}#statusbar{grid-template-columns:1fr}.track,.senses{display:none}}
</style></head><body>
<div id="stage"></div><header><div><h1>Fly Brain Lab <span id="connection">CONNECTING</span></h1><div class="sub">Viewer V2 · persistent connectome state · embodied closed loop</div></div><div id="dataset">loading…</div></header>
<section id="controls" class="panel glass"><label>Threat bearing<select id="azimuth"><option value="-45">left · −45°</option><option value="0">centred · 0°</option><option value="45" selected>right · +45°</option></select></label><div class="two"><label>Speed<input id="velocity" type="number" value="40" min="5" max="200"> cm/s</label><label>Radius<input id="radius" type="number" value="1" min=".1" max="5" step=".1"> cm</label></div><div class="two"><label class="check"><input id="silenceLC4" type="checkbox">silence LC4</label><label class="check"><input id="silenceLPLC2" type="checkbox">silence LPLC2</label></div><label class="check"><input id="brainToggle" type="checkbox" checked>real connectome inside head</label><label>Camera<select id="camera"><option value="orbit">orbit</option><option value="chase">chase</option><option value="top">overhead</option><option value="eye">fly-eye</option></select></label><div class="actions"><button id="stop" disabled>STOP</button><button id="run" class="primary">START LOOP</button></div></section>
<section id="telemetry" class="panel glass"><div class="metric"><span>BEHAVIOUR</span><b id="behaviour">IDLE</b></div><div class="metric"><span>LC4 TOTAL</span><b id="lc4" class="cyan">0</b></div><div class="metric"><span>LPLC2 TOTAL</span><b id="lplc2" class="amber">0</b></div><div class="metric"><span>DNp01 TOTAL</span><b id="dnp01" class="red">0</b></div><div class="metric"><span>DNa02 L / R</span><b id="dna">0 / 0 Hz</b></div><div class="metric"><span>STEERING</span><b id="steer">0 Hz</b></div><div class="metric"><span>ACTIVE / WINDOW</span><b id="active">0</b></div><div class="metric"><span>ELAPSED</span><b id="elapsed">0.00 s</b></div></section>
<section id="statusbar" class="glass"><span id="status">READY</span><div class="track"><i id="progress"></i></div><span class="senses">distance <b id="distance">—</b> · bearing <b id="angle">—</b></span></section><button id="experience">CINEMATIC MODE</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="/static/viewer-v2/world.js"></script><script src="/static/viewer-v2/fly-avatar.js"></script><script src="/static/viewer-v2/brain-overlay.js"></script><script src="/static/viewer-v2/app.js"></script></body></html>
